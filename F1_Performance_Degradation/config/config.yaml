# Model Configuration
model:
  input_dim: 10
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 256
  dropout: 0.1
  max_seq_length: 50

# Training Configuration
training:
  batch_size: 32
  learning_rate: 0.001
  num_epochs: 20
  sequence_length: 10

# Data Configuration
data:
  year: 2024
  races: [1, 2, 3, 4, 5]
  session_type: 'R'
  cache_dir: 'data/raw'
